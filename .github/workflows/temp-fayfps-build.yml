name: Temporary FayFPS PR Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'FayFPS/**'
      - '.github/workflows/build-fayfps.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout preloader SDK
        run: git clone --depth 1 https://github.com/LiteLDev/preloader-android FayFPS/preloader-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip

      - name: Configure
        run: >
          cmake -S FayFPS -B FayFPS/build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release
          -DPRELOADER_ANDROID_ROOT=${{ github.workspace }}/FayFPS/preloader-android

      - name: Build
        run: cmake --build FayFPS/build --target fayfps_mod

      - name: Package
        run: |
          mkdir -p FayFPS/dist/pkg
          cp FayFPS/build/libfayfps_mod.so FayFPS/dist/pkg/
          cp FayFPS/manifest.json FayFPS/dist/pkg/manifest.json
          cd FayFPS/dist/pkg
          zip -r ../Fay-FPS-Optimizer-v0.1.0.levipack .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fay-FPS-Optimizer
          path: FayFPS/dist/Fay-FPS-Optimizer-v0.1.0.levipack
